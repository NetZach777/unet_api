name: Python application CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code source
      uses: actions/checkout@v4
      with:
        lfs: true # Récupère ton modèle pour les tests sur le runner

    - name: Configuration de Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest fastapi httpx pillow numpy tensorflow
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint avec flake8
      run: |
        # Arrête le build s'il y a des erreurs de syntaxe Python ou des symboles non définis
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Sortie en douceur pour le reste (style)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test avec pytest
      run: |
        # Lance tes tests définis dans test_app.py
        pytest

  deploy:
    needs: build-and-test # Le déploiement ne se lance que si les tests passent
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Déploiement sur EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        HOSTNAME: ${{ secrets.HOST }}
        USER_NAME: ${{ secrets.EC2_USER }}    
      run: |
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        
        ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOSTNAME} << 'EOF'
          echo "--- Début du déploiement sur AWS ---"
          
          # 1. Gestion du dossier projet
          if [ ! -d "/home/ubuntu/unet_api" ]; then
            git clone https://github.com/NetZach777/unet_api.git /home/ubuntu/unet_api
            cd /home/ubuntu/unet_api
            git lfs install
          else
            cd /home/ubuntu/unet_api
            git fetch origin
            git reset --hard origin/main
          fi

          # 2. Récupération des fichiers LFS (le modèle .h5)
          git lfs pull

          # 3. Activation de l'environnement Conda
          source /home/ubuntu/miniconda3/etc/profile.d/conda.sh
          conda activate unet_api_env

          # 4. Installation des dépendances
          pip install --no-cache-dir -r requirements.txt

          # 5. Relance propre du serveur
          echo "Nettoyage du port 8000..."
          sudo fuser -k 8000/tcp || true
          sleep 2

          echo "Démarrage de l'API..."
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          
          echo "--- Déploiement terminé avec succès ! ---"
        EOF
        
        rm private_key
