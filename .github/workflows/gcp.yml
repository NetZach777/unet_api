name: Deploy U-Net API to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VM via SSH
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}
        run: |
          # 1. Préparation de la clé SSH
          printf "%s" "$PRIVATE_KEY" > private_key
          chmod 600 private_key

          # 2. Exécution des commandes sur la VM
          # On utilise StrictHostKeyChecking=no pour éviter le blocage de connexion
          ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOST} << 'EOF'
            echo "--- Connexion établie avec succès ---"
            
            # Aller dans le home de l'utilisateur
            cd ~

            # 3. Clone ou Pull du dépôt
            if [ ! -d "unet_api" ]; then
              git clone https://github.com/NetZach777/unet_api.git unet_api
              cd unet_api
            else
              cd unet_api
              git reset --hard HEAD
              git pull origin main
            fi

            # 4. Configuration de l'environnement Conda
            # On charge Conda dans le shell non-interactif
            source ~/miniconda3/etc/profile.d/conda.sh
            
            # Créer l'env s'il n'existe pas (la première fois)
            conda activate unet_api_env || (conda create -n unet_api_env python=3.9 -y && conda activate unet_api_env)

            # 5. Installation des dépendances avec gestion de la RAM
            mkdir -p ~/tmp
            export TMPDIR=~/tmp
            pip install --no-cache-dir -r requirements.txt

            # 6. Relance du serveur FastAPI
            echo "Relance du serveur Uvicorn..."
            sudo fuser -k 8000/tcp || true
            nohup uvicorn main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
            
            echo "--- Déploiement terminé ! ---"
          EOF

          # 7. Nettoyage de la clé sur le runner GitHub
          rm private_key
