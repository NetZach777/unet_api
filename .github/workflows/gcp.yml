name: Deploy U-Net API to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VM via SSH
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}

        run: |
          printf "%s" "$PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOST} << 'EOF'

            echo "🚀 Deploy start"

            cd ~

            # repo update propre
            if [ ! -d "unet_api" ]; then
              git clone https://github.com/NetZach777/unet_api.git
            fi

            cd unet_api
            git pull origin main

            # 🔥 FIX CONDA (important)
            source ~/miniconda3/etc/profile.d/conda.sh
            conda activate unet_api_env

            # install deps
            pip install --no-cache-dir -r requirements.txt

            # stop old process
            pkill -f uvicorn || true

            # start API (conda python safe)
            nohup python -m uvicorn main:app \
              --host 0.0.0.0 \
              --port 8000 \
              --workers 1 \
              > uvicorn.log 2>&1 &

            echo "✅ Deploy done"

          EOF

          rm -f private_key
