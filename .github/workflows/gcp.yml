name: Python application CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code source
      uses: actions/checkout@v3
      with:
        lfs: true

    - name: Configuration de Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Tests et Lint
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        flake8 .
        # pytest

    - name: Déploiement sur serveur (SSH)
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        HOSTNAME: ${{ secrets.HOST }}
        USER_NAME: ${{ secrets.EC2_USER }}
      run: |
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        
        ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOSTNAME} << 'EOF'
          
          # 1. Cloner ou mettre à jour le repo
          if [ ! -d ~/unet_api ]; then
            git clone https://github.com/NetZach777/unet_api.git ~/unet_api
          fi
          cd ~/unet_api
          
          git fetch origin
          git reset --hard origin/main

          # 2. Configurer Conda
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate unet_api_env

          # 3. Installer dépendances
          mkdir -p ~/tmp
          export TMPDIR=~/tmp
          pip install --no-cache-dir -r requirements.txt

          # 4. Stopper ancien process
          sudo fuser -k 8000/tcp || true
          sleep 2

          # 5. Lancer l'API
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
        
        EOF
        
        rm private_key
